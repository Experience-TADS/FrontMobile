<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toyota Experience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: sidebar escura + conteudo (organizacao do app de vendedor: saudacao, resumo, metricas em 3 colunas, listas com contadores); espacamento amplo e cantos suaves; tipografia geometrica arredondada */
:root{
  --font:'Plus Jakarta Sans','Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'Courier New',monospace;
  --red:#EB0A1E; --red-d:#C00D19; --red-tint:#FFF5F5;
  --ink:#1A1A1A; --bg:#FFFFFF; --soft:#F5F5F5; --surface:#FFFFFF; --muted:#6B7280; --line:#E5E7EB;
  --ok:#16A34A; --warn:#D97706; --err:#DC2626; --info:#2563EB; --violet:#7C3AED;
  --dark:#1A1A1A; --on-dark:#FFFFFF; --side-ink:#A1A1AA;
  --shadow:0 2px 8px rgba(0,0,0,.08); --cardline:#E5E7EB; color-scheme:light;
  --st0:#6B7280; --st1:#2563EB; --st2:#7C3AED; --st3:#D97706; --st4:#4338CA; --st5:#EA580C; --st6:#0D9488; --st7:#16A34A; --st8:#1A1A1A;
}

*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:14px;line-height:1.5;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
svg.ic{flex:none}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* shell */
.shell{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{background:var(--dark);color:var(--side-ink);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:24px 0;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 24px 28px;color:#fff;font-weight:800;letter-spacing:.02em;font-size:15px}
.mark{width:32px;height:32px;border-radius:8px;background:var(--red);display:grid;place-items:center;color:#fff}
.nav{display:grid;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:12px 24px;font-weight:600;border-left:3px solid transparent;color:var(--side-ink)}
.nav a:hover{color:#fff;background:rgba(255,255,255,.06)}
.nav a.on{background:var(--red);color:#fff;border-left-color:#fff}
.side-foot{margin-top:auto;padding:20px 24px 0;display:grid;gap:14px}
.sw{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:rgba(255,255,255,.07);border-radius:8px;padding:3px}
.sw a{text-align:center;padding:6px 0;border-radius:6px;font-size:11px;font-weight:700;color:var(--side-ink)}
.sw a.on{background:#fff;color:#1A1A1A}
.sw-l{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#71717A;font-weight:700}
.me{display:flex;gap:10px;align-items:center;color:#fff;min-width:0}
.me b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me small{color:var(--side-ink);font-size:11px}
.av{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.av.lg{width:80px;height:80px;font-size:28px}
.logout{display:flex;align-items:center;gap:8px;background:transparent;border:1px solid rgba(255,255,255,.18);color:#fff;border-radius:8px;padding:9px 12px;font-weight:600}
.logout:hover{background:rgba(255,255,255,.08)}
.main{padding:32px max(32px,env(safe-area-inset-right,0px)) 56px 32px;min-width:0;max-width:1320px;width:100%}
.topbar,.tabbar{display:none}

.ph{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:3px solid var(--red);margin-bottom:28px}
.ph h1{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.2;text-wrap:balance}
.ph p{color:var(--muted);margin-top:4px}
.crumb{font-size:13px;color:var(--muted);margin-bottom:8px}
.crumb a{color:var(--red);font-weight:600}

.card{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--cardline);padding:24px;min-width:0}
.card h2{font-size:16px;font-weight:700}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}
.stack{display:grid;gap:24px;align-content:start}
.grid-2{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.kpi{position:relative;overflow:hidden;display:grid;gap:6px;padding:22px 24px 26px}
.kpi::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--red)}
.kpi .top{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;font-weight:600}
.kpi .n{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.1;font-family:var(--mono);font-variant-numeric:tabular-nums}
.big{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.15}
.delta{font-size:13px;font-weight:700;color:var(--ok)}
.sum{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:end}
.sum .r{border-left:1px solid var(--line);padding-left:24px}
.metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:24px;padding-top:20px;border-top:1px solid var(--line)}
.m .lab{font-size:12px;color:var(--muted);font-weight:600}
.m .val{font-size:20px;font-weight:700;margin:2px 0;font-family:var(--mono);font-variant-numeric:tabular-nums}
.m .tag{font-size:12px;font-weight:700}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.row .ct{font-family:var(--mono);font-weight:700;font-size:18px}
a.row:hover{color:var(--red)}
.banner{background:var(--dark);color:#fff;border-radius:12px;padding:28px 32px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;box-shadow:var(--shadow)}
.banner h3{font-size:20px;font-weight:800;max-width:30ch;text-wrap:balance}
.banner a{color:#FF5A68;font-weight:700;display:inline-flex;gap:6px;align-items:center}

.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 11px;font-size:12px;font-weight:700;color:var(--c);background:color-mix(in srgb,var(--c) 13%,transparent);white-space:nowrap}
.chip.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.fchips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin-bottom:20px}
.fchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 18px;font-weight:600;white-space:nowrap}
.fchip:hover{border-color:var(--red)}
.fchip.on{background:var(--red);border-color:var(--red);color:#fff}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 20px;border-radius:8px;border:1.5px solid var(--red);background:var(--red);color:#fff;font-weight:700;white-space:nowrap}
.btn:hover{background:var(--red-d);border-color:var(--red-d)}
.btn.out{background:transparent;color:var(--red)}
.btn.out:hover{background:var(--red-tint)}
.btn.ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn.ghost:hover{background:var(--soft)}
.btn.danger{background:var(--err);border-color:var(--err);color:#fff}
.btn.sm{height:34px;padding:0 14px;font-size:13px}
.btn.block{width:100%;height:48px}
.acts{display:flex;gap:8px;flex-wrap:wrap}

.f{display:grid;gap:6px;min-width:0}
.f label{font-size:13px;font-weight:600}
input,select,textarea{width:100%;height:44px;padding:0 14px;border:1.5px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);font:inherit}
textarea{height:auto;padding:10px 14px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);box-shadow:0 0 0 3px color-mix(in srgb,var(--red) 18%,transparent)}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 20px}
.fgrid .full{grid-column:1/-1}
.pw{position:relative}
.pw button{position:absolute;right:6px;top:6px;width:32px;height:32px;border:0;background:transparent;color:var(--muted);border-radius:6px;display:grid;place-items:center}
.tools{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.tools .f{flex:1 1 240px}

.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;padding:12px 16px;font-weight:700;white-space:nowrap}
td{padding:16px;border-top:1px solid var(--line);vertical-align:middle}
td.num,th.num{text-align:right}
.person{display:flex;gap:10px;align-items:center}
.person .av{width:34px;height:34px;font-size:12px}
.sm-t{font-size:12px;color:var(--muted)}

.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.pcard{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);border:1px solid var(--cardline);overflow:hidden;display:grid}
.pimg{height:200px;background:var(--soft);display:grid;place-items:center;color:var(--muted)}
.pimg .car{width:72%}
.pbody{padding:20px 24px 24px;display:grid;gap:6px}
.pbody h3{font-size:18px;font-weight:800}
.pbody .price{font-family:var(--mono);font-weight:700;font-size:20px;margin:6px 0 10px;font-variant-numeric:tabular-nums}
.pager{display:flex;justify-content:center;gap:8px;margin-top:28px}
.pager button{min-width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:700}
.pager button.on{background:var(--red);border-color:var(--red);color:#fff}
.pager button:disabled{opacity:.4;cursor:default}

.pitem{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center}
.pitem .id{font-family:var(--mono);font-weight:700}

/* rastreamento */
.hero-st{background:var(--dark);color:#fff;border-radius:12px;padding:28px 32px;display:grid;gap:12px;box-shadow:var(--shadow)}
.hero-st .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#A1A1AA;font-weight:700}
.hero-st h2{font-size:24px;font-weight:800;letter-spacing:-.01em}
.hero-st .tip{background:rgba(255,255,255,.08);border-radius:8px;padding:12px 16px;color:#E4E4E7}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--red);border-radius:inherit}
.tl{max-width:640px;margin:0 auto}
.ts{display:grid;grid-template-columns:24px minmax(0,1fr);gap:16px;position:relative;padding-bottom:28px}
.ts:last-child{padding-bottom:0}
.ts::before{content:"";position:absolute;left:11px;top:24px;bottom:0;width:2px;background:var(--line)}
.ts:last-child::before{display:none}
.ts.done::before{background:var(--ok)}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:#fff;z-index:1}
.ts.done .dot{background:var(--ok);border-color:var(--ok)}
.ts.now .dot{background:var(--red);border-color:var(--red);animation:pulse 1.6s infinite}
.ts b{display:block;font-weight:700}
.ts.todo b{color:var(--muted);font-weight:600}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(235,10,30,.5)}70%{box-shadow:0 0 0 10px rgba(235,10,30,0)}100%{box-shadow:0 0 0 0 rgba(235,10,30,0)}}

/* agenda */
.ag{display:grid;gap:6px;padding:20px 24px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);border:1px solid var(--cardline)}
.ag .when{font-weight:800;font-size:16px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:12px}
.day{background:var(--surface);border-radius:12px;padding:14px;min-height:150px;box-shadow:var(--shadow);border:1px solid var(--cardline)}
.day.today{outline:2px solid var(--red)}
.day h4{margin:0;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day h4 b{display:block;font-size:20px;color:var(--ink);letter-spacing:0}
.ev{display:block;width:100%;text-align:left;border:0;border-left:4px solid var(--c);background:color-mix(in srgb,var(--c) 11%,var(--surface));border-radius:8px;padding:8px 10px;margin-top:8px;font-size:12px}
.ev b{display:block;font-size:13px}
.ev.x{opacity:.55;text-decoration:line-through}
.hrs{display:grid;gap:0}
.hr{display:grid;grid-template-columns:56px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line);align-items:center}
.hr:first-child{border-top:0}
.hr time{font-family:var(--mono);font-weight:700}

/* charts */
.hb{display:grid;gap:16px}
.hb .l{display:flex;justify-content:space-between;gap:12px;font-size:13px;margin-bottom:6px;flex-wrap:wrap}
.hb .t{height:12px;border-radius:99px;background:color-mix(in srgb,var(--red) 14%,transparent);overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--red);border-radius:inherit}
.chart{overflow-x:auto}
.chart svg{min-width:560px;width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font:11px var(--font)}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .vl{fill:var(--ink);font:700 11px var(--mono)}

/* modal */
.ov{position:fixed;inset:0;background:rgba(10,10,10,.55);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.md{background:var(--surface);border:1px solid var(--cardline);border-radius:12px;width:min(520px,100%);padding:28px;box-shadow:0 20px 60px rgba(0,0,0,.35);display:grid;gap:20px}
.md.wide{width:min(640px,100%)}
.ov.drawer{place-items:stretch end;padding:0}
.ov.drawer .md{border-radius:12px 0 0 12px;width:min(440px,100%);height:100%;overflow:auto;align-content:start}
.md-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
.md-h h2{font-size:20px;font-weight:800}
.x-btn{width:36px;height:36px;border-radius:8px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center}
.x-btn:hover{background:var(--soft)}
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 20px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1A1A1A;color:#fff;padding:12px 20px;border-radius:10px;font-weight:600;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100vw - 32px)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:24px 0}
.tabs button{border:0;background:transparent;padding:12px 18px;font-weight:700;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs button.on{color:var(--red);border-bottom-color:var(--red)}
.steps{display:flex;gap:8px}
.steps i{flex:1;height:6px;border-radius:99px;background:var(--line)}
.steps i.on{background:var(--red)}

/* login / cadastro */
.login{display:grid;grid-template-columns:60fr 40fr;min-height:100vh}
.lhero{position:relative;background:#111;color:#fff;overflow:hidden;display:grid;place-items:center;padding:48px;isolation:isolate}
.lhero svg.bg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.lhero::after{content:"";position:absolute;inset:0;background:rgba(0,0,0,.6);z-index:-1}
.lhero .wm{display:grid;gap:18px;justify-items:center;text-align:center}
.lhero .wm .mark{width:56px;height:56px;border-radius:14px}
.lhero h2{font-size:34px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.lhero p{color:#D4D4D8;max-width:36ch}
.lform{background:var(--surface);display:grid;align-content:center;padding:48px max(48px,env(safe-area-inset-right,0px)) 48px 48px}
.lform .in{width:min(380px,100%);margin:0 auto;display:grid;gap:20px}
.lform h1{font-size:28px;font-weight:800;letter-spacing:-.02em}
.lform .link{color:var(--red);font-weight:700}
.demo{border-top:1px solid var(--line);padding-top:20px;display:grid;gap:10px}
.demo .acts .btn{flex:1}
.cad{min-height:100vh;display:grid;place-items:center;padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.cad .card{width:min(480px,100%);display:grid;gap:22px;padding:32px}
.tipos{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tipo{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:20px 12px;display:grid;gap:8px;justify-items:center;font-weight:700}
.tipo.on{border-color:var(--red);background:var(--red-tint)}

@media (max-width:1200px){.week{grid-template-columns:minmax(0,1fr)}.day{min-height:0}}
@media (max-width:1100px){.grid-2{grid-template-columns:minmax(0,1fr)}.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .shell{display:block}.side{display:none}
  .topbar{display:flex;position:sticky;top:0;z-index:20;justify-content:space-between;align-items:center;background:var(--dark);color:#fff;padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));padding-top:calc(12px + env(safe-area-inset-top,0px))}
  .topbar .brand{padding:0}
  .topbar .logout{padding:7px 10px}
  .tabbar{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar a{display:grid;justify-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted)}
  .tabbar a.on{color:var(--red)}
  .main{padding:20px max(16px,env(safe-area-inset-right,0px)) calc(96px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
  .login{grid-template-columns:minmax(0,1fr)}
  .lhero{min-height:200px;padding:32px 24px}.lhero h2{font-size:24px}.lhero p{display:none}
  .lform{padding:32px max(20px,env(safe-area-inset-right,0px)) 40px max(20px,env(safe-area-inset-left,0px))}
}
@media (max-width:640px){
  .fgrid{grid-template-columns:minmax(0,1fr)}
  .pgrid{grid-template-columns:minmax(0,1fr)}
  .sum{grid-template-columns:minmax(0,1fr)}.sum .r{border-left:0;padding-left:0;border-top:1px solid var(--line);padding-top:16px}
  .pitem{grid-template-columns:minmax(0,1fr)}
  .ph h1{font-size:24px}
  .metrics{gap:10px}.m .val{font-size:16px}
  .card{padding:20px}
}
@media (prefers-reduced-motion:reduce){.ts.now .dot{animation:none}}
</style>
</head>
<body>
<div id="app"></div>
<div id="mr"></div>
<div id="tr"></div>
<script>
const $=(s,r=document)=>r.querySelector(s);
const TODAY=new Date('2026-11-03T19:00');
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const fd=i=>{const d=new Date(i);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`};
const ft=i=>{const d=new Date(i);return `${pad(d.getHours())}:${pad(d.getMinutes())}`};
const fdt=i=>`${fd(i)} ${ft(i)}`;
const loc=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const MES=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];

  <div class="tw"><table id="t-usr"><thead><tr><th>Usuário</th><th>Tipo</th><th>Role</th><th>Status</th><th>Ações</th></tr></thead><tbody>${USR.map(u=>`<tr data-t="${esc((u.n+' '+u.e).toLowerCase())}" data-r="${u.r}"><td><div class="person"><span class="av">${ini(u.n)}</span><div><b>${esc(u.n)}</b><div class="sm-t">${esc(u.e)}</div></div></div></td><td>${u.t}</td><td>${chip(u.r,ROLEC[u.r])}</td><td>${u.a?chip('Ativo','--ok',1):chip('Inativo','--st0',1)}</td><td><div class="acts"><button class="btn ghost sm" data-a="usrView" data-id="${u.id}">Ver</button><button class="btn out sm" data-a="usrToggle" data-id="${u.id}">${u.a?'Desativar':'Ativar'}</button></div></td></tr>`).join('')}</tbody></table></div></section>`;
}

function aAn(){
  const W=640,H=300,L=48,B=44,T=24,R=16,yMax=400,iw=W-L-R,ih=H-T-B,y=v=>T+ih-(v/yMax)*ih;
  const avg=AN.reduce((s,a)=>s+a.avg,0)/AN.length,bw=iw/AN.length;
  const total=AN.reduce((s,a)=>s+a.n,0),top=AN.slice().sort((a,b)=>b.n-a.n)[0],long=AN.slice().sort((a,b)=>b.avg-a.avg)[0];
  const grid=[0,100,200,300,400].map(v=>`<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text class="ax" x="${L-8}" y="${y(v)+4}" text-anchor="end">${v}</text>`).join('');
  const bars=AN.map((a,i)=>{const x=L+i*bw+bw*.2,w=bw*.6,yy=y(a.avg);return `<rect x="${x}" y="${yy}" width="${w}" height="${y(0)-yy}" rx="4" fill="#EB0A1E"/><text class="vl" x="${x+w/2}" y="${yy-6}" text-anchor="middle">${a.avg}</text><text class="ax" x="${x+w/2}" y="${H-B+18}" text-anchor="middle">${a.s}</text>`}).join('');
  return ph('Analytics de Navegação','Tempo médio de navegação por seção do aplicativo')+
  `<div class="stack"><div class="kpis">${kpi('Seção mais acessada',top.s,'chart').replace('class="n"','class="n" style="font-size:20px"')}${kpi('Maior tempo médio',`${long.s} · ${long.avg}s`,'bolt').replace('class="n"','class="n" style="font-size:20px"')}${kpi('Sessões registradas',total.toLocaleString('pt-BR'),'users')}</div>
  <section class="card"><div class="card-h"><h2>Duração média por seção (segundos)</h2></div><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico de barras com a duração média por seção">${grid}${bars}<line x1="${L}" x2="${W-R}" y1="${y(avg)}" y2="${y(avg)}" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="5 4"/><text class="ax" x="${W-R}" y="${y(avg)-6}" text-anchor="end">Média geral ${Math.round(avg)}s</text></svg></div></section>
  <section class="card"><div class="card-h"><h2>Detalhamento</h2></div><div class="tw"><table><thead><tr><th>Seção</th><th class="num">Total de registros</th><th class="num">Duração média</th><th class="num">Duração máxima</th></tr></thead><tbody>${AN.map(a=>`<tr><td><b>${a.s}</b></td><td class="num mono">${a.n.toLocaleString('pt-BR')}</td><td class="num mono">${a.avg}s</td><td class="num mono">${a.max}s</td></tr>`).join('')}</tbody></table></div></section></div>`;
}
/* ===== modais, ações e rota ===== */
let ROUTE=(location.hash||'#login').slice(1)||'login';
const go=h=>{ROUTE=h;try{location.hash=h}catch(e){}render()};
const toast=m=>{const t=$('#tr');t.innerHTML=`<div class="toast" role="status">${esc(m)}</div>`;clearTimeout(toast.t);toast.t=setTimeout(()=>t.innerHTML='',2600)};
const modal=(title,body,o={})=>{$('#mr').innerHTML=`<div class="ov ${o.drawer?'drawer':''}" data-a="ovClose"><div class="md ${o.wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="md-h"><h2>${title}</h2><button class="x-btn" data-a="close" aria-label="Fechar">${ic('x',18)}</button></div>${body}</div></div>`;const f=$('#mr input,#mr select');if(f)f.focus()};
const close=()=>{$('#mr').innerHTML=''};
const confirmM=(t,msg,action,id,danger,label='Confirmar')=>modal(t,`<p class="muted">${msg}</p><div class="acts" style="justify-content:flex-end"><button class="btn ghost" data-a="close">Cancelar</button><button class="btn ${danger?'danger':''}" data-a="${action}" data-id="${id}">${label}</button></div>`);
const mask={cpf:v=>v.replace(/\D/g,'').slice(0,11).replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d{1,2})$/,'$1-$2'),
cnpj:v=>v.replace(/\D/g,'').slice(0,14).replace(/(\d{2})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1.$2').replace(/(\d{3})(\d)/,'$1/$2').replace(/(\d{4})(\d{1,2})$/,'$1-$2'),
tel:v=>v.replace(/\D/g,'').slice(0,11).replace(/(\d{2})(\d)/,'($1) $2').replace(/(\d{5})(\d{1,4})$/,'$1-$2')};
const val=id=>($('#'+id)?.value||'').trim();
const saveCad=()=>{document.querySelectorAll('.cad input').forEach(i=>S.cad.v[i.id]=i.value)};

function npModal(){
  const n=S.np;let b='';
  if(n.s===1)b=`<div class="f"><label for="npc">Cliente</label><input id="npc" list="cl" value="${esc(n.c)}" placeholder="Digite para buscar"><datalist id="cl">${USR.filter(u=>u.r==='CLIENTE').map(u=>`<option value="${esc(u.n)}">`).join('')}</datalist></div>`;
  if(n.s===2)b=`<div class="f"><label for="npp">Produto</label><select id="npp">${PROD.map(p=>`<option value="${p.id}" ${n.p===p.id?'selected':''}>${esc(p.modelo)} ${esc(p.versao)} · ${esc(p.cor)} · ${brl(p.preco)}</option>`).join('')}</select></div>`;
  if(n.s===3){const p=PROD.find(x=>x.id===n.p);b=`<dl class="dl"><dt>Cliente</dt><dd>${esc(n.c)}</dd><dt>Produto</dt><dd>${esc(p.modelo)} ${esc(p.versao)} · ${esc(p.cor)}</dd><dt>Valor total</dt><dd class="mono" style="color:var(--red);font-size:20px">${brl(p.preco)}</dd><dt>Data</dt><dd>${fdt(TODAY)}</dd></dl>`}
  modal(`Novo pedido · passo ${n.s} de 3`,`<div class="steps">${[1,2,3].map(i=>`<i class="${i<=n.s?'on':''}"></i>`).join('')}</div>${b}<div class="acts" style="justify-content:flex-end">${n.s>1?'<button class="btn ghost" data-a="npBack">Voltar</button>':''}<button class="btn" data-a="${n.s<3?'npNext':'npSave'}">${n.s<3?'Continuar':'Confirmar pedido'}</button></div>`);

function prodModal(id){
  const p=PROD.find(x=>x.id===+id)||{modelo:'',versao:'',cor:'',ano:2024,preco:''};
  modal(id?'Editar produto':'Novo produto',`<form data-submit="prodSave" data-id="${id||''}" class="fgrid"><div class="f"><label for="fm">Modelo</label><input id="fm" required value="${esc(p.modelo)}"></div><div class="f"><label for="fv">Versão</label><input id="fv" required value="${esc(p.versao)}"></div><div class="f"><label for="fc">Cor</label><input id="fc" required value="${esc(p.cor)}"></div><div class="f"><label for="fa">Ano</label><input id="fa" type="number" required value="${p.ano}"></div><div class="f full"><label for="fp">Preço (R$)</label><input id="fp" type="number" step="0.01" required value="${p.preco}"></div><div class="full acts" style="justify-content:flex-end"><button type="button" class="btn ghost" data-a="close">Cancelar</button><button class="btn" type="submit">Salvar</button></div></form>`);
}
function agForm(e){
  const a=e||{cliente:'',tipo:'VISITA',dt:loc(TODAY).slice(0,11)+'10:00',obs:''};
  return `<form data-submit="${e?'agSave':'agNewSave'}" data-id="${e?e.id:''}" class="fgrid"><div class="f full"><label for="ac">Cliente</label><input id="ac" list="cl2" required value="${esc(a.cliente)}"><datalist id="cl2">${USR.filter(u=>u.r==='CLIENTE').map(u=>`<option value="${esc(u.n)}">`).join('')}</datalist></div>
  <div class="f"><label for="at">Tipo</label><select id="at">${Object.entries(TIPO).map(([k,t])=>`<option value="${k}" ${a.tipo===k?'selected':''}>${t.l}</option>`).join('')}</select></div>
  <div class="f"><label for="ad">Data e hora</label><input id="ad" type="datetime-local" required value="${a.dt}"></div>
  ${e?`<div class="f full"><label for="as">Status</label><select id="as">${Object.entries(AST).map(([k,t])=>`<option value="${k}" ${a.status===k?'selected':''}>${t.l}</option>`).join('')}</select></div>`:''}
  <div class="f full"><label for="ao">Observação</label><textarea id="ao" rows="2">${esc(a.obs)}</textarea></div>
  <div class="full acts" style="justify-content:flex-end"><button type="button" class="btn ghost" data-a="close">Cancelar</button><button class="btn" type="submit">Salvar</button></div></form>`;
}

const H={
logout(){close();go('login')},
close,ovClose(el,e){if(e.target===el)close()},
toast(el){toast(el.dataset.v)},
togglePw(el){const i=$('#pw'),s=i.type==='password';i.type=s?'text':'password';el.innerHTML=ic(s?'eyeoff':'eye',18)},
cadTipo(el){saveCad();S.cad.tipo=el.dataset.v;render()},
cadNext(){saveCad();const c=S.cad;
  if(c.step===1&&!c.tipo)return toast('Escolha o tipo de pessoa');
  if(c.step===2){const v=c.v;if(!v.nome||!v.email||!v.senha)return toast('Preencha nome, e-mail e senha');if(v.senha!==v.senha2)return toast('As senhas não conferem')}
  c.step++;render()},
cadBack(){saveCad();S.cad.step--;render()},
cadFinish(){saveCad();const v=S.cad.v;if(S.cad.tipo==='PF'&&!v.cpf)return toast('Informe o CPF');if(S.cad.tipo==='PJ'&&(!v.cnpj||!v.razao))return toast('Informe CNPJ e razão social');
  S.cad={step:1,tipo:null,v:{}};toast('Conta criada (protótipo)');go('cliente-dashboard')},
catFilter(el){S.cat.f=el.dataset.v;S.cat.p=1;render()},
catPage(el){S.cat.p=+el.dataset.v;render()},
catDetail(el){const p=PROD.find(x=>x.id===+el.dataset.id);modal(`${esc(p.modelo)} ${esc(p.versao)}`,`<div class="pimg" style="border-radius:8px">${CAR}</div><dl class="dl"><dt>Cor</dt><dd>${esc(p.cor)}</dd><dt>Ano</dt><dd class="mono">${p.ano}</dd><dt>Preço</dt><dd class="mono" style="font-size:20px">${brl(p.preco)}</dd></dl><button class="btn block" data-a="testDrive">Solicitar test drive</button>`)},
testDrive(){close();toast('Solicitação de test drive registrada')},
pedDetail(el){const p=PED.find(x=>x.id===el.dataset.id);modal(`Pedido #${p.id}`,`<dl class="dl"><dt>Cliente</dt><dd>${esc(p.cliente)}</dd><dt>Vendedor</dt><dd>${p.vend}</dd><dt>Modelo</dt><dd>${esc(p.modelo)} ${esc(p.versao)} ${p.ano}</dd><dt>Cor</dt><dd>${esc(p.cor)}</dd><dt>Data</dt><dd>${fdt(p.data)}</dd><dt>Chassi</dt><dd class="mono">${p.chassi||'Aguardando alocação'}</dd><dt>Valor total</dt><dd class="mono" style="color:var(--red);font-size:20px">${brl(p.valor)}</dd></dl>`)},
npOpen(){S.np={s:1,c:'',p:PROD[0].id};npModal()},
npNext(){const n=S.np;if(n.s===1){const c=val('npc');if(!USR.some(u=>u.n===c&&u.r==='CLIENTE'))return toast('Selecione um cliente da lista');n.c=c}if(n.s===2)n.p=+$('#npp').value;n.s++;npModal()},
npBack(){if(S.np.s===2)S.np.p=+$('#npp').value;S.np.s--;npModal()},
npSave(){const n=S.np,p=PROD.find(x=>x.id===n.p),id=pad(PED.length+1).padStart(3,'0'),ch=String(10001+VEI.length);
  PED.unshift({id,cliente:n.c,vend:'Carlos Vendedor Toyota',modelo:p.modelo,versao:p.versao,cor:p.cor,ano:p.ano,valor:p.preco,data:loc(TODAY),chassi:ch});
  VEI.push({chassi:ch,modelo:`${p.modelo} ${p.versao}`,cor:p.cor,etapa:0,pedido:id,cliente:n.c,hist:[loc(TODAY)]});close();toast(`Pedido #${id} criado`);render()},
veiFilter(el){S.vf=el.dataset.v;render()},
veiStatus(el){const v=VEI.find(x=>x.chassi===el.dataset.id);modal(`Atualizar status · ${v.chassi}`,`<form data-submit="veiSave" data-id="${v.chassi}" class="stack" style="gap:16px"><p class="muted">${v.modelo} · atual: ${STATUS[v.etapa].l}</p><div class="f"><label for="vs">Novo status</label><select id="vs">${STATUS.map((s,i)=>`<option value="${i}" ${i===Math.min(v.etapa+1,8)?'selected':''}>${s.l}</option>`).join('')}</select></div><div class="acts" style="justify-content:flex-end"><button type="button" class="btn ghost" data-a="close">Cancelar</button><button class="btn" type="submit">Confirmar</button></div></form>`)},
veiHist(el){const v=VEI.find(x=>x.chassi===el.dataset.id);modal(`Histórico · ${v.chassi}`,`<div class="tl" style="width:100%">${STATUS.slice(0,v.etapa+1).map((s,i)=>`<div class="ts ${i<v.etapa?'done':'now'}"><span class="dot">${i<v.etapa?ic('check',14):''}</span><div><b>${s.l}</b><span class="sm-t">${fdt(v.hist[i])}</span></div></div>`).join('')}</div>`)},
veiChegada(el){const v=VEI.find(x=>x.chassi===el.dataset.id);v.etapa=7;v.hist[7]=loc(new Date());toast(`Chassi ${v.chassi} na concessionária`);render()},
prodForm(el){prodModal(el.dataset.id)},
prodDel(el){const p=PROD.find(x=>x.id===+el.dataset.id);confirmM('Excluir produto',`Tem certeza? Esta ação não pode ser desfeita.<br><b>${esc(p.modelo)} ${esc(p.versao)}</b>`,'prodDelOk',p.id,true,'Excluir')},
prodDelOk(el){PROD.splice(PROD.findIndex(x=>x.id===+el.dataset.id),1);close();toast('Produto excluído');render()},
agWeek(el){const v=+el.dataset.v;S.week=v===0?0:S.week+v;render()},
agNew(){modal('Novo agendamento',agForm())},
agEv(el){const e=AG.find(x=>x.id===+el.dataset.id);modal(`${TIPO[e.tipo].l} · ${esc(e.cliente)}`,agForm(e),{drawer:true})},
usrFilter(el){S.uf=el.dataset.v;render()},
usrView(el){const u=USR.find(x=>x.id===+el.dataset.id);modal(esc(u.n),`<dl class="dl"><dt>E-mail</dt><dd>${esc(u.e)}</dd><dt>Tipo</dt><dd>${u.t}</dd><dt>Role</dt><dd>${u.r}</dd><dt>Cadastro</dt><dd>${fd(u.d)}</dd><dt>Status</dt><dd>${u.a?'Ativo':'Inativo'}</dd></dl>`)},
usrToggle(el){const u=USR.find(x=>x.id===+el.dataset.id);confirmM(u.a?'Desativar usuário':'Ativar usuário',`${u.a?'Desativar':'Ativar'} o acesso de <b>${esc(u.n)}</b>?`,'usrOk',u.id,u.a,u.a?'Desativar':'Ativar')},
usrOk(el){const u=USR.find(x=>x.id===+el.dataset.id);u.a=!u.a;close();toast(u.a?'Usuário ativado':'Usuário desativado');render()},
perTab(el){S.tab=el.dataset.v;render()}
};
const SUB={
login(f){const e=val('em').toLowerCase();go(e.includes('admin')?'admin-dashboard':e.includes('vend')?'vendedor-dashboard':'cliente-dashboard')},
saveDados(){toast('Alterações salvas')},
addEnd(){S.end.push({cep:val('ecep'),log:val('elog'),n:val('enum')||'s/n',bairro:val('ebai'),cidade:val('ecid'),uf:val('euf').toUpperCase()});toast('Endereço adicionado');render()},
addTel(){S.tel.push(val('tel'));toast('Telefone adicionado');render()},
prodSave(f){const o={modelo:val('fm'),versao:val('fv'),cor:val('fc'),ano:+val('fa'),preco:+val('fp')};
  if(f.dataset.id)Object.assign(PROD.find(x=>x.id===+f.dataset.id),o);else PROD.push({id:Math.max(...PROD.map(p=>p.id))+1,...o});close();toast('Produto salvo');render()},
veiSave(f){const v=VEI.find(x=>x.chassi===f.dataset.id),i=+$('#vs').value;
  v.hist=v.hist.slice(0,i+1);while(v.hist.length<=i)v.hist.push(loc(new Date()));v.etapa=i;close();toast(`Chassi ${v.chassi}: ${STATUS[i].l}`);render()},
agSave(f){const e=AG.find(x=>x.id===+f.dataset.id);Object.assign(e,{cliente:val('ac'),tipo:val('at'),dt:val('ad'),status:val('as'),obs:val('ao')});close();toast('Agendamento atualizado');render()},
agNewSave(){AG.push({id:AG.length+1,cliente:val('ac'),tipo:val('at'),dt:val('ad'),obs:val('ao'),status:'PENDENTE',vend:'Carlos Vendedor Toyota'});close();toast('Agendamento criado');render()}
};

document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(a){e.preventDefault();go(a.getAttribute('href').slice(1));return}
  const el=e.target.closest('[data-a]');if(!el)return;const fn=H[el.dataset.a];if(fn){if(el.dataset.a==='ovClose'){fn(el,e)}else{fn(el,e)}}});
document.addEventListener('submit',e=>{e.preventDefault();SUB[e.target.dataset.submit]?.(e.target)});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.mask)t.value=mask[t.dataset.mask](t.value);
  if(t.dataset.filter==='pedidos'){S.pq=t.value;filterRows()}
  if(t.dataset.filter==='usr'){S.uq=t.value;filterRows()}});
function filterRows(){
  document.querySelectorAll('#t-pedidos tbody tr').forEach(r=>r.hidden=!r.dataset.t.includes(S.pq.toLowerCase()));
  document.querySelectorAll('#t-usr tbody tr').forEach(r=>r.hidden=!r.dataset.t.includes(S.uq.toLowerCase())||(S.uf!=='Todos'&&r.dataset.r!==S.uf));
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});

function page(h){
  if(h==='cliente-dashboard')return cDash();
  if(h==='cliente-catalogo')return cCat();
  if(h==='cliente-meus-pedidos')return cPeds();
  if(h.startsWith('cliente-pedido-'))return cPed(h.slice(15));
  if(h.startsWith('cliente-rastreamento-'))return cRastr(h.slice(21));
  if(h==='cliente-agendamentos')return cAg();
  if(h==='cliente-perfil')return cPerfil();
  if(h==='vendedor-dashboard')return vDash();
  if(h==='vendedor-pedidos'||h==='admin-pedidos')return pedidosV(h.startsWith('admin'));
  if(h==='vendedor-agenda')return vAgenda();
  if(h==='vendedor-veiculos'||h==='admin-veiculos')return vVeic(h.startsWith('admin'));
  if(h==='vendedor-produtos'||h==='admin-produtos')return vProd(h.startsWith('admin'));
  if(h==='admin-dashboard')return aDash();
  if(h==='admin-usuarios')return aUsr();
  if(h==='admin-analytics')return aAn();
  return null;
}
let lastH=null;
function render(){
  const h=ROUTE||'login';
  close();
  let out;
  if(h==='login')out=vLogin();
  else if(h==='cadastro')out=vCad();
  else{const b=page(h);if(b==null){go('login');return}out=shell(h.split('-')[0],h,b)}
  const y=h===lastH?window.scrollY:0;
  $('#app').innerHTML=out;
  window.scrollTo(0,y);lastH=h;
  if(h==='vendedor-pedidos'||h==='admin-pedidos'||h==='admin-usuarios')filterRows();
}
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h&&h!==ROUTE){ROUTE=h;render()}});
render();
</script>
